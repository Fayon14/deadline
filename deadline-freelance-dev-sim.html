<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEADLINE: Freelance Dev Sim</title>
<style>
:root{
  --bg:#0a0d14; --panel:#121826; --panel2:#0d1220; --line:#243049;
  --ink:#dce6f8; --dim:#8ba0c4; --faint:#5b6c8f;
  --acc:#5ef2a0; --acc2:#8f7bff; --warn:#ffb454; --bad:#ff6b6b; --gold:#ffd166; --blue:#6fb3ff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;overflow-x:hidden}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.btn{display:inline-block;padding:9px 18px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-weight:600;letter-spacing:.02em;transition:all .15s ease;user-select:none}
.btn:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,#1d8f5c,#25b874);border-color:#2bd684;color:#04130b}
.btn.primary:hover{color:#04130b;filter:brightness(1.12)}
.btn.danger{border-color:#5c2b33;color:#ff9b9b}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:6px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.hidden{display:none!important}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 120%,#152036 0%,#0a0d14 60%)}
#introCanvas{position:absolute;inset:0;width:100%;height:100%}
.intro-inner{position:relative;z-index:2;text-align:center;padding:20px;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
#gameTitle{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(44px,9vw,86px);font-weight:800;letter-spacing:.14em;color:#fff;text-shadow:0 0 24px rgba(94,242,160,.45),0 0 70px rgba(143,123,255,.3);animation:flicker 4s infinite}
@keyframes flicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.6}94%{opacity:1}97%{opacity:.85}98%{opacity:1}}
#gameSub{margin-top:6px;color:var(--dim);font-size:15px;letter-spacing:.34em;text-transform:uppercase}
.intro-tag{margin:26px auto 34px;max-width:520px;color:var(--dim);font-size:15px;font-style:italic}
.intro-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
#introStats{margin-top:22px;color:var(--faint);font-size:12.5px}

/* ---------- topbar ---------- */
#game{min-height:100vh;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 18px;background:rgba(13,18,32,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#logo{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;letter-spacing:.12em;color:var(--acc);font-size:17px;cursor:pointer}
#logo span{color:var(--acc2)}
.stat{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--dim);white-space:nowrap}
.stat b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.stat .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint)}
.minibar{width:70px;height:7px;border-radius:4px;background:#1a2334;overflow:hidden}
.minibar i{display:block;height:100%;border-radius:4px;transition:width .4s ease}
#energyFill{background:linear-gradient(90deg,#ff6b6b,#ffd166,#5ef2a0)}
#stressFill{background:linear-gradient(90deg,#5ef2a0,#ffd166,#ff6b6b)}
#rankBadge{display:flex;flex-direction:column;gap:1px;min-width:130px}
#rankBadge .rn{font-size:12.5px;font-weight:700;color:var(--acc2);letter-spacing:.04em}
#rankBadge .bar{height:5px;margin-top:2px}
#dayInfo{margin-left:auto;text-align:right;font-size:12.5px;color:var(--dim)}
#dayInfo b{color:var(--ink);font-size:14px}
.day-actions{display:flex;gap:8px;align-items:center}

/* ---------- tabs ---------- */
#tabs{display:flex;gap:4px;padding:8px 14px 0;flex-wrap:wrap}
.tab{padding:9px 20px;border:1px solid transparent;border-bottom:none;border-radius:9px 9px 0 0;color:var(--dim);font-weight:600;font-size:14px;position:relative;transition:all .15s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--acc);background:var(--panel);border-color:var(--line)}
.tab .dot{position:absolute;top:7px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 8px var(--warn);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tab .key{font-size:10px;color:var(--faint);margin-left:6px}
main{flex:1;padding:16px 18px 30px;background:linear-gradient(180deg,var(--panel) 0%,var(--bg) 240px);min-height:60vh}
.panel{max-width:1080px;margin:0 auto}
h2.ph{font-size:19px;margin:2px 0 14px;letter-spacing:.02em}
h2.ph small{color:var(--faint);font-weight:400;font-size:12.5px;margin-left:10px}

/* ---------- cards ---------- */
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;transition:border-color .2s,transform .15s}
.card:hover{border-color:#334263}
.card h3{font-size:16px;margin-bottom:4px}
.card.offer{border-left:3px solid var(--acc2)}
.card.offer:hover{transform:translateY(-1px);border-color:#44538a;border-left-color:var(--acc2)}
.meta{color:var(--dim);font-size:13px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--dim);letter-spacing:.04em}
.tag.good{color:var(--acc);border-color:#2a5c42}
.tag.warn{color:var(--warn);border-color:#5c4a2b}
.tag.bad{color:var(--bad);border-color:#5c2b33}
.tag.info{color:var(--blue);border-color:#2b455c}
.tag.gold{color:var(--gold);border-color:#5c522b}
.tag.hot{color:#ff9de2;border-color:#5c2b4d;animation:pulse 2s infinite}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pay{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.faint{color:var(--faint)} .green{color:var(--acc)} .red{color:var(--bad)}
.empty{padding:44px 20px;text-align:center;color:var(--faint);border:1px dashed var(--line);border-radius:12px;font-size:14px}

/* ---------- bars & stars ---------- */
.bar{height:10px;border-radius:6px;background:#1a2334;overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;border-radius:6px;transition:width .35s ease}
.fill-acc{background:linear-gradient(90deg,#1d8f5c,#5ef2a0)}
.fill-acc2{background:linear-gradient(90deg,#4a3d99,#8f7bff)}
.fill-gold{background:linear-gradient(90deg,#8f6b1d,#ffd166)}
.stars{color:var(--gold);letter-spacing:2px;font-size:14px}
.stars .off{color:#3a465f}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.1em;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid #1a2334}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- modal ---------- */
#modalRoot{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(4,7,12,.78);backdrop-filter:blur(4px);padding:16px}
#modalRoot.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:680px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 24px;animation:pop .22s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.modal h3{font-size:18px;margin-bottom:10px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.field{margin:12px 0}
.field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin-bottom:5px}
.field input[type=number],.field input[type=text],.field select,.field textarea{width:100%;padding:9px 12px;background:#0b0f1a;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:14px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc2)}
.range{width:100%;accent-color:var(--acc)}
.hint{font-size:12.5px;color:var(--faint);margin-top:4px}
.chopt{display:block;width:100%;text-align:left;padding:12px 15px;margin:7px 0;border:1px solid var(--line);border-radius:9px;background:#0b0f1a;font-size:13.5px;transition:all .15s}
.chopt:hover{border-color:var(--acc2);transform:translateX(2px)}
.chopt.right{border-color:var(--acc);color:var(--acc)}
.chopt.wrong{border-color:var(--bad);color:var(--bad)}
.chopt:disabled{cursor:default;opacity:.9}

/* ---------- typing challenge ---------- */
#tyTarget{background:#070a11;border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.75;white-space:pre-wrap;word-break:break-all;margin:10px 0;max-height:240px;overflow:auto}
#tyTarget .done{color:var(--acc)}
#tyTarget .cur{background:var(--acc2);color:#fff;border-radius:2px}
#tyTarget .err{color:var(--bad);background:#3b1219;border-radius:2px}
#tyInput{width:100%;min-height:120px;resize:vertical;background:#0b0f1a;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;padding:10px 12px;outline:none}
#tyInput:focus{border-color:var(--acc)}
.tybar{display:flex;align-items:center;gap:12px;margin:8px 0}
#tyTimer{flex:1;height:8px;border-radius:5px;background:#1a2334;overflow:hidden}
#tyTimer i{display:block;height:100%;background:linear-gradient(90deg,#5ef2a0,#ffd166,#ff6b6b)}
.tystat{font-size:13px;color:var(--dim);white-space:nowrap;display:flex;gap:12px}
.tystat b{color:var(--ink)}
.combo{color:var(--acc2);font-weight:700}

/* ---------- toasts & log ---------- */
#toasts{position:fixed;bottom:18px;right:18px;z-index:70;display:flex;flex-direction:column;gap:9px;max-width:340px}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:11px 15px;font-size:13.5px;animation:tin .3s ease both;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.warn{border-left-color:var(--warn)}
.toast.bad{border-left-color:var(--bad)}
.toast.gold{border-left-color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.toast.out{animation:tout .3s ease both}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}
#logWrap{border-top:1px solid var(--line);padding:10px 18px 14px;background:var(--panel2)}
#logWrap h4{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--faint);margin-bottom:6px}
#log{max-height:130px;overflow-y:auto;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--dim)}
#log .d{color:var(--faint);margin-right:8px}
#log .good{color:var(--acc)} #log .bad{color:var(--bad)} #log .warn{color:var(--warn)} #log .gold{color:var(--gold)} #log .acc2{color:var(--acc2)}

/* ---------- bank card ---------- */
.bankcard{width:250px;min-width:210px;border-radius:14px;padding:14px 16px;color:#fff;background:linear-gradient(135deg,#1a2f4b 0%,#2b1a4b 55%,#4b1a35 100%);border:1px solid #3a4a6b;box-shadow:0 10px 24px rgba(0,0,0,.45);transition:transform .15s}
.bankcard:hover{transform:translateY(-2px)}
.bc-top{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;opacity:.85}
.bc-num{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16.5px;letter-spacing:.12em;margin:14px 0 10px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.bc-bot{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.1em;opacity:.85;text-transform:uppercase}
.subrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1a2334}
.subrow:last-child{border-bottom:none}
.lifegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lifebtn{border:1px solid var(--line);border-radius:10px;background:#0b0f1a;padding:10px 12px;text-align:left;font-size:13px;transition:all .15s}
.lifebtn:hover{border-color:var(--acc);transform:translateY(-1px)}
.lifebtn .c{color:var(--gold);font-weight:700;font-size:12px;margin-top:3px}
.lifebtn .d{color:var(--faint);font-size:11px;margin-top:2px}

/* ---------- misc ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint)}
.avat{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#08131b;flex:none}
.feat{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1a2334}
.feat:last-child{border-bottom:none}
.feat .ic{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.feat.done .ic{background:#123b29;border-color:#2bd684;color:var(--acc)}
.feat .nm{flex:1;font-size:13.5px}
.scrollY{max-height:420px;overflow-y:auto}
.ach{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#0b0f1a}
.ach .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;border:1px solid var(--line);filter:grayscale(1);opacity:.4}
.ach.got .ic{filter:none;opacity:1;background:#2a2413;border-color:#5c522b}
.ach .t{font-size:13px;font-weight:600}
.ach .m{font-size:11.5px;color:var(--faint)}
.ach.got{border-color:#5c522b}
#spark{width:100%;height:70px;display:block}
.kbd{font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
@media(max-width:760px){.grid2,.grid3,.grid4{grid-template-columns:1fr}#topbar{gap:10px}.minibar{width:50px}.day-actions{width:100%}.tab .key{display:none}}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#26314a;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="intro">
  <canvas id="introCanvas"></canvas>
  <div class="intro-inner">
    <div id="gameTitle">DEADLINE</div>
    <div id="gameSub">freelance dev simulator</div>
    <div class="intro-tag">Find clients. Build the thing. Send the invoice. Wait.<br>And whatever you do, don't miss the deadline.</div>
    <div class="intro-btns">
      <button class="btn primary" id="btnNew" style="font-size:16px;padding:12px 30px">New Game</button>
      <button class="btn hidden" id="btnContinue" style="font-size:16px;padding:12px 30px">Continue</button>
    </div>
    <div id="introStats" class="mono"></div>
  </div>
</div>

<div id="game" class="hidden">
  <header id="topbar">
    <div id="logo" title="back to inbox">DEAD<span>LINE</span></div>
    <div class="stat"><span class="lbl">Cash</span><b id="stCash">$0</b></div>
    <div class="stat"><span class="lbl">Energy</span><div class="minibar"><i id="energyFill"></i></div><b id="stEnergy">100</b></div>
    <div class="stat"><span class="lbl">Stress</span><div class="minibar"><i id="stressFill"></i></div><b id="stStress">0</b></div>
    <div class="stat"><span class="lbl">Rep</span><span class="stars" id="stRep"></span><b id="stRepN"></b></div>
    <div id="rankBadge"><span class="rn" id="rankName"></span><div class="bar"><i id="rankFill" class="fill-acc2"></i></div></div>
    <div id="dayInfo"><b id="stDay">Day 1</b> <span id="stWk">Mon</span><br><span id="stDate"></span></div>
    <div class="day-actions">
      <button class="btn sm" id="btnCoffee" title="caffeine now">Coffee</button>
      <button class="btn sm" id="btnDrink" title="energy drink, 3 a day">Energy drink</button>
      <button class="btn sm" id="btnBankTop" title="bank app, card, subscriptions">Bank</button>
      <button class="btn sm" id="btnShop" title="upgrade your setup">Gear</button>
      <button class="btn sm primary" id="btnSleep" title="end the day (Space)">Sleep &#9656;</button>
    </div>
  </header>
  <nav id="tabs">
    <button class="tab on" data-tab="inbox">Inbox<span class="dot hidden" id="dotInbox"></span><span class="key">1</span></button>
    <button class="tab" data-tab="work">Work<span class="dot hidden" id="dotWork"></span><span class="key">2</span></button>
    <button class="tab" data-tab="clients">Clients<span class="key">3</span></button>
    <button class="tab" data-tab="money">Money<span class="dot hidden" id="dotMoney"></span><span class="key">4</span></button>
    <button class="tab" data-tab="you">You<span class="key">5</span></button>
  </nav>
  <main><div class="panel">
    <section id="tab-inbox"></section>
    <section id="tab-work" class="hidden"></section>
    <section id="tab-clients" class="hidden"></section>
    <section id="tab-money" class="hidden"></section>
    <section id="tab-you" class="hidden"></section>
  </div></main>
  <div id="logWrap"><h4>Terminal</h4><div id="log"></div></div>
</div>

<div id="modalRoot"><div class="modal" id="modalBox"></div></div>
<div id="toasts"></div>

<script>
"use strict";
/* ============================== DEADLINE v2 ==============================
   Freelance dev simulator. Single file, no external assets.
   ======================================================================= */

/* ---------- tiny utils ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt$=n=>(n<0?"-$":"$")+Math.abs(Math.round(n)).toLocaleString("en-US");
let uidc=1; const nid=()=>uidc++;
const WEEK=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- audio ---------- */
let AC=null, MUTED=false;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} return AC; }
function beep(f,d,type,vol){
  const c=ac(); if(!c||MUTED) return;
  try{
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||"sine"; o.frequency.value=f;
    g.gain.setValueAtTime(vol||.08,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+(d||.15));
    o.connect(g);g.connect(c.destination);
    o.start();o.stop(c.currentTime+(d||.15));
  }catch(e){}
}
const SFX={
  click:()=>beep(660,.06,"square",.04),
  type:()=>beep(880+rnd(-120,120),.03,"square",.015),
  err:()=>beep(180,.12,"sawtooth",.05),
  good:()=>{beep(523,.09,"sine",.07);setTimeout(()=>beep(784,.14,"sine",.07),90)},
  cash:()=>{beep(880,.08,"triangle",.08);setTimeout(()=>beep(1318,.18,"triangle",.08),80)},
  bad:()=>beep(160,.25,"sawtooth",.07),
  warn:()=>beep(320,.15,"sine",.06),
  levelup:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.12,"triangle",.06),i*90))},
  ship:()=>{[392,523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.1,"triangle",.07),i*80))},
};

/* ---------- skills & ranks ---------- */
const SKILLS=["frontend","backend","design","devops","comms"];
const SKILL_LABEL={frontend:"Frontend",backend:"Backend",design:"Design",devops:"DevOps",comms:"Communication"};
const xpNeed=l=>l*90;
const RANKS=[
  {name:"Couch Coder",    need:{done:0, earned:0,     rep:0}},
  {name:"Side Hustler",   need:{done:2, earned:4000,  rep:0}},
  {name:"Proper Freelancer", need:{done:5, earned:15000, rep:3.5}},
  {name:"In-Demand Dev",  need:{done:9, earned:40000, rep:4.0}},

  {name:"Legend of the Invoice", need:{done:25,earned:200000,rep:4.5}},
];
function rankIndex(){
  let idx=0;
  for(let i=0;i<RANKS.length;i++){
    const n=RANKS[i].need;
    if(S.projectsDone>=n.done && S.totalEarned>=n.earned && S.rep>=n.rep) idx=i;
  }
  return idx;
}
function rankProgress(){
  const i=rankIndex();
  if(i>=RANKS.length-1) return 1;
  const cur=RANKS[i].need, nxt=RANKS[i+1].need;
  const p1=clamp(S.projectsDone/Math.max(1,nxt.done),0,1);
  const p2=clamp(S.totalEarned/Math.max(1,nxt.earned),0,1);
  const p3=nxt.rep>0?clamp((S.rep-3)/Math.max(.01,nxt.rep-3),0,1):1;
  return (p1+p2+p3)/3;
}
function projectSlots(){ return rankIndex()>=2?2:1; }

/* ---------- market pulse (rotating demand) ---------- */
function rollMarket(){
  const hot=shuffle(CATEGORIES.map(c=>c.id)).slice(0,3);
  return {week:Math.floor((S.day-1)/7), hot, updated:S.day};
}
function market(){
  if(!S.market||S.market.week!==Math.floor((S.day-1)/7)) S.market=rollMarket();
  return S.market;
}
function isHot(catId){ return market().hot.includes(catId); }

const VARS2=["orders","invoices","leads","posts","tasks","events","shifts","jobs","bills","members","listings","tickets","trips","books","rentals","invoices"];
const VARS3=["Order","Invoice","Lead","Post","Task","Event","Shift","Job","Bill","Member","Listing","Ticket","Trip","Book","Rental","Invoice"];
const _recentSnips=[];
function makeSnippet(){
  for(let t=0;t<80;t++){
    const tpl=pick(SNIPPET_T);
    const v1=pick(VARS1), v2=pick(VARS2), V2=pick(VARS3);
    const n1=pick([16,24,32,48,64,80,100,120,200,760]);
    const text=tpl.map(line=>line.replace(/\{v1\}/g,v1).replace(/\{v2\}/g,v2).replace(/\{V2\}/g,V2).replace(/\{n1\}/g,n1).replace(/\{N1\}/g,n1%100)).join("\n");
    if(!_recentSnips.includes(text)){
      _recentSnips.push(text); if(_recentSnips.length>60) _recentSnips.shift();
      return text;
    }
  }
  // guaranteed-unique fallback: stamp a comment the player will never see twice
  const tpl=pick(SNIPPET_T);
  const tag="  // session "+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36);
  const n1b=pick([16,24,32,48,64,80,100,120,200,760]);
  return tpl.map(line=>line.replace(/\{v1\}/g,pick(VARS1)).replace(/\{v2\}/g,pick(VARS2)).replace(/\{V2\}/g,pick(VARS3)).replace(/\{n1\}/g,n1b).replace(/\{N1\}/g,n1b%100)).join("\n")+tag;
}
const _recentBriefs=[];
function pickBrief(cat, client){
  for(let t=0;t<40;t++){
    const b=pick(cat.briefs).replace("{C}",client.company).replace("{N}",client.name.split(" ")[0]);
    if(!_recentBriefs.includes(b)){ _recentBriefs.push(b); if(_recentBriefs.length>24) _recentBriefs.shift(); return b; }
  }
  return pick(cat.briefs).replace("{C}",client.company).replace("{N}",client.name.split(" ")[0])+" ("+client.industry+")";
}

/* ---------- dates (30-day months, day 1 = Monday Jan 1) ---------- */
function dayParts(d){
  const m=Math.floor((d-1)/30), dom=((d-1)%30)+1, dow=(d-1)%7;
  return {month:MONTHS[m%12], dom, dow:WEEK[dow], dowN:(d-1)%7, year:1+Math.floor(m/12), monthN:m%12};
}
function dateStr(d){ const p=dayParts(d); return p.month+" "+p.dom+", Year "+p.year; }
function isWeekend(d){ const n=(d-1)%7; return n===5||n===6; }

/* ---------- clients ---------- */
function makeClient(){
  const name=makeUniqueName();
  const {co, industry}=makeUniqueCompany();
  const pers=pick(PERSONALITIES);
  const c={
    id:nid(), name, company:co, industry, pers:pers.id,
    netDays:NET_DAYS[pers.id]||14,
    lateMult:pers.late||1, tip:pers.tip||0, picky:pers.picky||0,
    budgetMult:rnd(.85,1.2)*(pers.pay||1),
    goodwill:60, history:[], projects:0, earned:0,
  };
  S.clients.push(c);
  return c;
}
function clientBusy(c){
  if(S.projects.some(p=>p.client.id===c.id)) return true;
  if(S.offers.some(o=>o.client.id===c.id)) return true;
  return false;
}
function pickOfferClient(){
  const roster=S.clients.filter(c=>!clientBusy(c));
  if(roster.length && chance(.4)){
    const c=pick(roster);
    const fresh=CATEGORIES.filter(cat=>!c.history.includes(cat.id));
    if(fresh.length) return {c, cat:weightedCat(fresh)};
  }
  const c=makeClient();
  return {c, cat:weightedCat(CATEGORIES)};
}
function weightedCat(pool){
  const rep=S.rep;
  const w=pool.map(cat=>{
    let x=1;
    const big=["mobile","dashboard","gameproto","crm","devops","migration"];
    if(big.includes(cat.id)) x = rep>=3.8?1.2:0.35;
    if(["bugfix","automation","website"].includes(cat.id)) x=1.4;
    if(isHot(cat.id)) x*=2.2;
    return x;
  });
  let total=w.reduce((a,b)=>a+b,0), r=Math.random()*total;
  for(let i=0;i<pool.length;i++){ r-=w[i]; if(r<=0) return pool[i]; }
  return pool[pool.length-1];
}

/* ---------- offer generation (computed pay, not table ranges) ---------- */
function avgSkillFit(cat){
  const ks=Object.keys(cat.sk||{});
  if(!ks.length) return 3;
  return ks.reduce((a,k)=>a+S.skills[k],0)/ks.length;
}
function computePay(cat, client, diff, skillFit){
  let base=cat.base*(0.8+diff*0.12);
  base*=client.budgetMult;
  base*=isHot(cat.id)?1.2:1;
  base*=1+(skillFit-2)*0.04;
  base*=1+(S.rep-3)*0.06;
  if(client.pers==="vip") base*=1.25;
  if(client.pers==="cheap") base*=0.9;
  return Math.max(300, Math.round(base/10)*10);
}
function genOffer(silent){
  const {c, cat}=pickOfferClient();
  const diff=rnd(cat.diff[0],cat.diff[1]);
  const skillFit=avgSkillFit(cat);
  const ask=computePay(cat,c,diff,skillFit);
  const featCount=clamp(Math.round(rnd(3.4,5.6)+diff*0.4),3,6);
  const feats=shuffle(cat.feats).slice(0,featCount).map(nm=>({name:nm,diff:clamp(Math.round(diff*rnd(.7,1.3)),1,6)}));
  const brief=pickBrief(cat, c);
  const off={
    id:nid(), client:c, catId:cat.id, catName:cat.name, blurb:cat.blurb||"",
    title:cat.name+" for "+c.company,
    brief:c.name.split(" ")[0]+" from "+c.company+" ("+c.industry+") "+brief+".",
    ask, days:rndi(cat.days[0],cat.days[1]), diff:Math.round(diff*10)/10, feats,
    createdDay:S.day, pers:c.pers, req:cat.sk, hot:isHot(cat.id),
  };
  S.offers.push(off);
  S.lastOfferDay=S.day;
  if(!silent){ log("New offer: "+cat.name+" from "+c.company+" ("+fmt$(ask)+")","gold"); SFX.warn(); }
  return off;
}
function eligible(off){
  return Object.keys(off.req||{}).every(k=>S.skills[k]>=Math.max(1,off.req[k]-1));
}
function offerExpire(off){ return S.day-off.createdDay>12; }

function issueInvoice(client, amount, netDays, note){
  const inv={id:nid(), clientId:client.id, clientName:client.name, company:client.company,
    amount:Math.round(amount), issued:S.day, due:S.day+netDays, status:"due", paid:0, nags:0, ghost:false, note:note||""};
  S.invoices.push(inv);
  log("Invoice sent to "+client.company+": "+fmt$(amount)+" (net "+netDays+")","acc2");
  return inv;
}
function clientById(id){ return S.clients.find(c=>c.id===id); }
function addRep(n){ S.rep=clamp(Math.round((S.rep+n)*100)/100,1,5); }
function invoicePayChance(inv){
  const c=clientById(inv.clientId); if(!c) return .6;
  let base=.42;
  if(c.pers==="generous") base=.75;
  if(c.pers==="vip") base=.6;
  if(c.pers==="ghosty") base=.22;
  if(c.pers==="late") base=.25;
  base*=c.lateMult>1.5?0.8:1;
  if(inv.nags>0) base+=.18*inv.nags;
  if(c.goodwill>75) base+=.08;
  if(c.goodwill<35) base-=.1;
  return clamp(base,0.08,0.95);
}
function tickInvoices(){
  for(const inv of S.invoices){
    if(inv.status!=="due") continue;
    if(inv.due>S.day) continue;
    const c=clientById(inv.clientId);
    const payP=invoicePayChance(inv)*(inv.ghost?(inv.nags>0?0.5:0):1);
    if(Math.random()<payP){
      const late=inv.due<S.day;
      inv.status="paid"; inv.paid=S.day;
      money(inv.amount, "Payment: "+inv.company, "income");
      S.totalEarned+=inv.amount;
      if(c){ c.earned+=inv.amount; c.goodwill=clamp(c.goodwill+4,0,100); }
      SFX.cash();
      toast("Payment received: "+fmt$(inv.amount)+" from "+inv.company+(late?" (late)":""),"gold");
      log("PAID "+fmt$(inv.amount)+" <- "+inv.company+(late?" (late)":""),"gold");
    } else if(!inv.ghost && chance(.03)){
      inv.ghost=true;
      log(inv.company+" has gone quiet about their invoice...","bad");
      toast("Ghosted: "+inv.company+" stopped responding about "+fmt$(inv.amount),"bad");
    } else {
      if(inv.due===S.day){ log("Invoice past due: "+inv.company+" ("+fmt$(inv.amount)+")","warn"); }
    }
  }
}
function nagInvoice(id){
  const inv=S.invoices.find(i=>i.id===id); if(!inv||inv.status!=="due") return;
  const c=clientById(inv.clientId);
  inv.nags++;
  SFX.click();
  if(c && (c.pers==="picky"||c.pers==="vip"||c.pers==="bureaucrat") && chance(.3)){
    c.goodwill=clamp(c.goodwill-8,0,100);
    toast(c.name+" seemed annoyed by the reminder.","warn");
    log("Nagged "+inv.company+". They did not love it.","warn");
  } else {
    toast("Reminder sent to "+inv.company+".","good");
    log("Nagged "+inv.company+" about "+fmt$(inv.amount),"acc2");
  }
  save(); renderAll();
}
function writeOffInvoice(id){
  const inv=S.invoices.find(i=>i.id===id); if(!inv||inv.status!=="due") return;
  inv.status="written";
  const c=clientById(inv.clientId);
  if(c) c.goodwill=clamp(c.goodwill-15,0,100);
  log("Wrote off "+fmt$(inv.amount)+" from "+inv.company+". Painful lesson.","bad");
  toast("Wrote off "+fmt$(inv.amount)+". Some clients teach expensive lessons.","bad");
  save(); renderAll();
}
function tickBills(){

  setTimeout(()=>inp.focus(),50);
  inp.addEventListener("input", onType);
  $("#tyQuit").onclick=()=>{ endType(false); };
}
function renderTarget(target, typed){
  let out="";
  for(let i=0;i<target.length;i++){
    const ch=target[i]==="\n"?"\n":target[i];
    let cls="";
    if(i<typed.length) cls = typed[i]===target[i] ? "done" : "err";
    else if(i===typed.length) cls="cur";
    out+= cls ? `<span class="${cls}">${esc(ch)}</span>` : esc(ch);
  }
  if(typed.length>=target.length) out+='<span class="cur"> </span>';
  return out;
}
function onType(){
  if(!TY||TY.done) return;
  const inp=$("#tyInput");
  TY.typed=inp.value;
  TY.correct=0;
  for(let i=0;i<TY.typed.length;i++){ if(TY.typed[i]===TY.target[i]) TY.correct++; }
  const len=TY.target.length;
  const pct=Math.round(TY.typed.length/len*100);
  const acc=Math.round(TY.correct/Math.max(1,TY.typed.length)*100);
  const st=$("#tyAcc"); if(st) st.textContent=acc+"%";
  const pr=$("#tyProg"); if(pr) pr.textContent=pct+"%";
  const tt=$("#tyTarget"); if(tt){ tt.innerHTML=renderTarget(TY.target,TY.typed); tt.scrollTop=tt.scrollHeight*0.6; }
  const bar=$("#tyTimer i"); if(bar) bar.style.width=pct+"%";
  if(chance(.3)) SFX.type();
  if(TY.typed.length>=len){ endType(true); }
}
function endType(finished){
  if(!TY||TY.done) return;
  TY.done=true;
  const p=P(TY.pid), feat=p.features[TY.fi];
  const acc=clamp(TY.correct/Math.max(1,TY.typed.length||TY.target.length),0,1);
  const gain=Math.round(sessionGain(feat,acc)*(finished?1:0.5));
  feat.prog=clamp(feat.prog+gain,0,100);
  spendEnergy(SESSION_COST);
  S.sessionsToday++;
  let bugTxt="";
  if(Math.random()<bugChance(feat)*(1.2-acc*0.5)){
    p.hiddenBugs++;
    bugTxt=" ...and you left a bug in there.";
  }
  TY=null;
  closeModal();
  SFX.click();
  if(feat.prog>=100){
    feat.done=true;
    log("Feature complete: "+feat.name+" ("+p.offer.title+")","good");
    toast("Feature shipped: "+feat.name,"good");
    gainXp("frontend",8); gainXp("backend",4);
    if(p.features.every(f=>f.done)){ p.phase="test"; toast("All features built on "+p.offer.title+". Run the tests.","good"); SFX.good(); }
  } else {
    toast("+"+gain+"% on "+feat.name+bugTxt, bugTxt?"warn":"");
  }
  save(); renderAll();
}
/* ---------- testing & bugfixing ---------- */
function runTests(pid){
  const p=P(pid); if(!p||p.phase!=="test") return;
  const found=[];
  for(let i=0;i<p.hiddenBugs;i++) found.push(makeBug());
  const extra=chance(.35)?1:0;
  for(let i=0;i<extra;i++) found.push(makeBug());
  p.hiddenBugs=0;
  p.bugs=found;
  p.testedDay=S.day;
  log("Tests finished on "+p.offer.title+": "+found.length+" bug(s).", found.length?"bad":"good");
  if(found.length){ SFX.bad(); toast("Tests found "+found.length+" bug(s) on "+p.offer.title+".","bad"); }
  else { toast("Tests clean. Ready to deliver.","good"); SFX.good(); }
  save(); renderAll();
}
function makeBug(){
  const q=pick(BUGQUIZ);
  const opts=shuffle(q.o.map((t,i)=>({t,ok:i===0})));
  return {id:nid(), q:q.q, opts};
}
function fixBug(pid, bid, optIdx){
  const p=P(pid); if(!p) return;
  const b=p.bugs.find(x=>x.id===bid); if(!b) return;
  const ok=b.opts[optIdx].ok;
  if(ok){
    p.bugs=p.bugs.filter(x=>x.id!==bid);
    gainXp("backend",10);
    SFX.good();
    toast("Fixed.","good");
    log("Bug fixed: "+b.q,"good");
  } else {
    addStress(6);
    SFX.bad();
    toast("That made it worse. Try again.","bad");
  }
  save(); renderAll();
  if(!ok) openFixModal(pid, bid);
}
/* ---------- delivery ---------- */
function qualityNow(p){
  let q=58+p.features.filter(f=>f.done).length*6 - p.bugs.length*9 + avgSkill();
  if(S.gear.desklamp) q+=2;
  const dueDay=p.offer.createdDay+p.offer.days;
  if(S.day>dueDay+1) q-=8;
  return clamp(Math.round(q),5,100);
}
function avgSkill(){ return SKILLS.reduce((a,k)=>a+S.skills[k],0)/SKILLS.length; }
function deliverProject(pid){
  const p=P(pid); if(!p) return;
  const q=qualityNow(p);
  const dueDay=p.offer.createdDay+p.offer.days;
  const onTime=S.day<=dueDay+1;
  const lateDays=Math.max(0,S.day-dueDay);
  let stars=1+q/26+(onTime?0.5:-1.1)+(p.client.picky?-(p.bugs.length?0.6:0.1):0)+rnd(-0.25,0.35);
  stars=clamp(Math.round(stars*2)/2,1,5);
  const rest=p.quote-p.depositPaid;
  issueInvoice(p.client,rest,p.client.netDays,"Final payment: "+p.offer.title);
  if(p.client.tip&&chance(p.client.tip)){
    money(120,"Tip from "+p.client.company,"income");
    S.totalEarned+=120;
    toast("Bonus from "+p.client.name+": $120. They noticed the effort.","gold");
  }
  S.reviews.push({day:S.day+rndi(1,3), stars, clientId:p.client.id, project:p.offer.title, txt:reviewText(stars,p.client)});
  p.client.projects++;
  p.client.goodwill=clamp(p.client.goodwill+(stars>=4?10:(stars>=3?2:-12)),0,100);
  S.projectsDone++;
  gainXp("comms",12);
  if(lateDays>0) addStress(8);
  log("Delivered "+p.offer.title+" (quality "+q+"/100, "+stars+" stars"+(lateDays?", "+lateDays+"d late":"")+")","gold");
  SFX.ship();
  S.projects=S.projects.filter(x=>x.id!==pid);
  save(); renderAll();
  toast("Shipped. Invoice for "+fmt$(rest)+" is out. Now you wait.","gold");
  maybeMilestone(); checkRankUp();
}
/* ---------- xp ---------- */
function gainXp(k,n){
  S.xp[k]=(S.xp[k]||0)+n;
  while(S.xp[k]>=xpNeed(S.skills[k]) && S.skills[k]<10){
    S.xp[k]-=xpNeed(S.skills[k]);
    S.skills[k]++;
    SFX.levelup();
    toast(SKILL_LABEL[k]+" advanced to level "+S.skills[k]+".","gold",5000);
    log(SKILL_LABEL[k]+" is now level "+S.skills[k],"gold");
  }
}

/* ---------- day advance ---------- */
function advanceDay(){
  if(checkBroke()) return;
  S.day++;
  S.cashHist.push(S.cash); if(S.cashHist.length>140) S.cashHist.shift();
  sleepNight();
  if(S.machineBroken) S.machineBroken=false;
  tickInvoices();
  tickBills();
  weeklyTick();
  rollEvents();
  rollOffers();
  rollReviews();
  checkBroke();
  save();
  renderAll();
}
function rollOffers(){
  const gap=S.day-S.lastOfferDay;
  let p=clamp(0.28+gap*0.18+(S.rep-3)*0.08,0.15,0.95);
  if(isWeekend(S.day)) p*=0.45;
  if(S.projects.length && S.day-Math.min(...S.projects.map(x=>x.startedDay))<2) p*=0.7;
  if(S.projects.length>=projectSlots()) p*=0.35;
  if(chance(p)){
    genOffer();
    if(chance(.25)) genOffer();
  }
  const before=S.offers.length;
  S.offers=S.offers.filter(o=>!offerExpire(o));
  if(S.offers.length<before) log("An old offer expired. Clients move on fast.","warn");
  if(S.offers.length>6) S.offers=S.offers.slice(-6);
}
function rollReviews(){
  const due=S.reviews.filter(r=>r.day<=S.day);
  S.reviews=S.reviews.filter(r=>r.day>S.day);
  for(const r of due){
    const c=clientById(r.clientId);
    S.repCount++;
    S.rep=clamp(((S.rep*Math.max(1,S.repCount-1))+r.stars)/(Math.max(1,S.repCount)),1,5);
    const name=c?c.name:"a client";
    toast("New review ("+r.stars+" stars): \""+r.txt+"\"", r.stars>=3.5?"gold":"bad",5000);
    log("Review from "+name+": "+r.stars+" stars. "+r.txt, r.stars>=3.5?"gold":"bad");
    maybeMilestone();
  }
  S.rep=Math.round(S.rep*100)/100;
}
function rollEvents(){
  const n=chance(.55)?1:(chance(.5)?2:0);
  for(let i=0;i<n;i++) fireRandomEvent();
}
function fireRandomEvent(){
  const pool=[];
  if(S.projects.length) pool.push("scope","scope","revise");
  if(S.invoices.some(i=>i.status==="due"&&i.due>=S.day-6)) pool.push("ghost");
  pool.push("referral","recruiter","inspired","portfoliolove","windfall","mentor");
  if(!S.gear.ups) pool.push("laptop");
  if(S.gear.coffeemachine) pool.push("coffee");
  if(chance(.4)) pool.push("sick");
  if(chance(.3)) pool.push("competitor");
  if(S.rep>=4&&chance(.3)) pool.push("reviewbomb");
  const ev=pick(pool);
  switch(ev){
    case "scope":{
      const p=pick(S.projects); if(!p) break;
      const featName=pick(["a dark mode","an admin page nobody asked for","a print-this-report button","a Stripe integration","an email newsletter","multi-language support","a mobile version","a settings page"]);
      const extra=Math.round(p.quote*0.12/10)*10;
      openChoiceModal("Scope creep",
        esc(p.client.name)+" calls: \""+esc(featName)+". Just one more thing. It's small, right?\" It is not small.",
        [
          {label:"Take it (+"+fmt$(extra)+", more work, more stress)",fn:()=>{
            p.features.push({name:"Extra: "+featName,diff:rndi(2,4),prog:0,done:false});
            p.phase="dev"; p.quote+=extra;
            addStress(7);
            toast("Scope grew. So did the invoice.","warn");
            log("Scope creep on "+p.offer.title+": "+featName+" (+"+fmt$(extra)+")","warn");
            save(); renderAll();
          }},
          {label:"Politely decline",fn:()=>{
            p.client.goodwill=clamp(p.client.goodwill-4,0,100);
            toast("You held the line on scope.","good");
            log("Declined scope creep: "+featName,"acc2");
            save(); renderAll();
          }},
        ]);
      break;}
    case "revise":{
      const p=pick(S.projects); if(!p) break;
      if(p.phase==="test"||p.phase==="delivered") break;
      const done=p.features.filter(x=>x.done);
      const f=done.length?pick(done):null;
      if(!f) break;
      if(S.gear.whiteboard&&!p.absorbedRevision){
        p.absorbedRevision=true;
        toast("Your whiteboard caught the revision early. Free fix.","good");
        log("Whiteboard absorbed a revision on "+p.offer.title,"acc2");
        break;
      }
      f.done=false; f.prog=Math.round(f.prog*0.45);
      p.phase="dev";
      addStress(5);
      if(p.client.picky) addStress(3);
      toast(p.client.name+" wants changes to "+f.name+". Revision cycle.","warn");
      log("Revision request on "+p.offer.title+": "+f.name,"warn");
      break;}
    case "ghost":{
      const inv=pick(S.invoices.filter(i=>i.status==="due"));
      if(!inv) break;
      inv.due+=rndi(1,3);
      toast(inv.company+" said the check is 'in process'. It is not.","warn");
      log("Payment delayed: "+inv.company,"warn");
      break;}
    case "laptop":{
      const cost=S.gear.ups?rndi(40,90):rndi(180,420);
      money(-cost,"Laptop repair","expense");
      if(!S.gear.ups){ S.skipWork=true; toast("Laptop died mid-build. Repair: "+fmt$(cost)+". The day is written off.","bad"); log("Laptop failure. No work today.","bad"); }
      else { toast("Power flicker. The battery backup saved you; "+fmt$(cost)+" for a new fuse.","warn"); log("Minor laptop scare: "+fmt$(cost),"warn"); }
      SFX.bad();
      break;}
    case "referral":{
      addRep(+0.08);
      genOffer();
      toast("A past client referred you. Rep up, new offer in your inbox.","gold");
      log("Referral came in. Rep rising.","gold");
      break;}
    case "recruiter":{
      money(200,"Recruiter referral fee","income"); S.totalEarned+=200;
      toast("A recruiter paid you $200 for referring a friend. Weird system, take the money.","good");
      log("Recruiter referral fee: +$200","good");
      break;}
    case "inspired":{
      S.inspired=true;
      toast("3am idea. It's actually good. Next session +25%.","good");
      log("Inspiration struck.","acc2");
      break;}
    case "sick":{
      S.skipWork=true;
      S.energy=clamp(S.energy-15,0,100);
      toast("You caught something. No work today, no matter the deadline.","bad");
      log("Sick day.","bad");
      break;}
    case "coffee":{
      if(S.gear.coffeemachine&&!S.machineBroken){ S.machineBroken=true; money(-80,"Espresso machine repair","expense"); toast("Espresso machine died. "+fmt$(80)+" to revive it.","warn"); }
      break;}
    case "reviewbomb":{
      addRep(+0.15);
      toast("Someone shared your portfolio online. Rep is climbing.","gold");
      log("Portfolio got shared. Rep up.","gold");
      break;}
    case "portfoliolove":{
      addRep(+0.06);
      toast("A dev blog linked your work. Nice.","good");
      break;}
    case "windfall":{
      const amt=rndi(60,240);
      money(amt,"Found money (old expense refund)","income"); S.totalEarned+=amt;
      toast("A late expense refund landed: "+fmt$(amt)+".","good");
      log("Expense refund: +"+fmt$(amt),"good");
      break;}
    case "mentor":{
      gainXp(pick(SKILLS),12);
      toast("A senior dev reviewed your code over coffee. Free XP.","good");
      log("Mentor session. XP gained.","acc2");
      break;}
    case "competitor":{
      addRep(-0.06);
      toast("A rival freelancer undercut your rates somewhere. Rep dips a hair.","warn");
      log("Competitive pressure. Rep -0.06.","warn");
      break;}
  }
}

function drawSpark(){
  const cv=$("#spark"); if(!cv) return;
  const ctx=cv.getContext("2d");
  const w=cv.width=cv.offsetWidth*2, hgt=cv.height=140;
  const data=S.cashHist.slice(-120);
  ctx.clearRect(0,0,w,hgt);
  if(data.length<2) return;
  const min=Math.min(...data,0), max=Math.max(...data,1);
  const px=i=>i/(data.length-1)*w, py=v=>hgt-8-(v-min)/(max-min||1)*(hgt-16);
  ctx.strokeStyle="#243049"; ctx.beginPath(); ctx.moveTo(0,py(0)); ctx.lineTo(w,py(0)); ctx.stroke();
  ctx.beginPath();
  data.forEach((v,i)=>{ i?ctx.lineTo(px(i),py(v)):ctx.moveTo(px(i),py(v)); });
  ctx.strokeStyle=S.cash<0?"#ff6b6b":"#5ef2a0"; ctx.lineWidth=3; ctx.stroke();
  ctx.lineTo(w,py(0)); ctx.lineTo(0,py(0)); ctx.closePath();
  ctx.fillStyle=S.cash<0?"rgba(255,107,107,.08)":"rgba(94,242,160,.08)"; ctx.fill();
}

/* ---------- negotiation (slider + typeable amount, single-fire) ---------- */
function openNegotiation(off){
  const suggested=Math.round(off.ask/10)*10;
  const lo=Math.max(100,Math.round(suggested*0.4)), hi=Math.round(suggested*2);
  openModal(`<h3>Negotiate: ${esc(off.title)}</h3>
    <p style="margin:8px 0">${esc(off.brief)}</p>
    <div class="tagrow">
      ${persTag(off.pers)}
      <span class="tag info">difficulty ${off.diff}</span>
      <span class="tag">deadline ${off.days}d</span>
      <span class="tag warn">pays net ${off.client.netDays}</span>
      <span class="tag">${off.feats.length} features</span>
    </div>
    <div class="field">
      <label>Your quote (their ballpark: about ${fmt$(suggested)})</label>
      <input type="range" class="range" id="qRange" min="${lo}" max="${hi}" step="10" value="${suggested}">
      <input type="number" id="qNum" min="0" step="10" value="${suggested}" style="margin-top:8px;font-size:20px;font-weight:800;width:180px">
      <div class="hint">Type an exact amount or drag the slider. Communication level ${S.skills.comms} gives you a little leverage. Ask for too much and they walk.</div>
    </div>
    <div class="field">
      <label><input type="checkbox" id="qDeposit" checked> Ask for a 30% deposit (protects against late payment, some clients refuse)</label>
    </div>
    <div class="actions"><button class="btn ghost" data-close>Walk away</button><button class="btn primary" id="qSend">Send quote</button></div>`);
  const range=$("#qRange"), num=$("#qNum");
  let syncing=false;
  range.oninput=()=>{ if(syncing) return; syncing=true; num.value=range.value; syncing=false; };
  num.oninput=()=>{ if(syncing) return; syncing=true; const v=clamp(parseInt(num.value,10)||0,lo,hi); range.value=v; syncing=false; };
  const send=$("#qSend");
  send.onclick=()=>{
    if(send.dataset.sent==="1") return;   // guard: a quote can only be sent once
    send.dataset.sent="1";
    const amount=clamp(parseInt(num.value,10)||suggested,100,999999);
    const wantDeposit=$("#qDeposit").checked;
    const v=quoteVerdict(off,amount);
    SFX.click();
    if(v.kind==="decline"){
      closeModal();
      openChoiceModal("They walked",esc(off.client.name)+" says the budget doesn't come close. Silence follows. You get nothing this time.",[
        {label:"Oh well",fn:()=>{ S.offers=S.offers.filter(o=>o.id!==off.id); log("Quote of "+fmt$(amount)+" got rejected outright.","warn"); save(); renderAll(); }},
      ]);
      return;
    }
    if(v.kind==="counter"){
      openChoiceModal("Counter-offer",esc(off.client.name)+" winces at the number. \"We can do "+fmt$(v.counter)+". Final.\"",[
        {label:"Take "+fmt$(v.counter),fn:()=>{ closeNegotiate(off,v.counter,wantDeposit); }},
        {label:"Hold at "+fmt$(amount),fn:()=>{ S.offers=S.offers.filter(o=>o.id!==off.id); log("Held firm at "+fmt$(amount)+" and they moved on.","warn"); toast("They respected the spine but not the number. Offer gone.","warn"); save(); renderAll(); }},
        {label:"Walk away",fn:()=>{ S.offers=S.offers.filter(o=>o.id!==off.id); log("Walked from negotiation at "+fmt$(amount),"warn"); save(); renderAll(); }},
      ]);
      return;
    }
    closeNegotiate(off,amount,wantDeposit);
  };
}
function closeNegotiate(off,amount,wantDeposit){
  const depositRefusers=["cheap","vip","ghosty"];
  let depositOk=wantDeposit&&!depositRefusers.includes(off.pers);
  if(wantDeposit&&!depositOk){
    toast(off.client.name+" refuses deposits. Payment on delivery only.","warn");
  }
  const depositPaid=depositOk?Math.round(amount*0.3):0;
  closeModal();
  startProject(off,amount,depositOk,depositPaid);
}

    const id=b.dataset.sub;
    if(S.bank.subs.includes(id)){ S.bank.subs=S.bank.subs.filter(x=>x!==id); toast("Cancelled. One less drain.","good"); }
    else { const sub=SUBSCRIPTIONS.find(x=>x.id===id); if(S.cash<sub.cost){ toast("Card declines. Not enough cash.","bad"); SFX.bad(); return; } S.bank.subs.push(id); toast("Subscribed to "+sub.name+".","good"); }
    SFX.click(); save(); openBank(); renderAll();
  });
  $$("#modalBox [data-food]").forEach(b=>b.onclick=()=>{
    S.bank.foodMode=b.dataset.food;
    toast("Groceries plan set to "+FOOD_MODES[S.bank.foodMode].label+".","good");
    SFX.click(); save(); openBank();
  });
  $$("#modalBox [data-life]").forEach(b=>b.onclick=()=>{ buyLife(b.dataset.life); openBank(); });
}
/* ---------- bugfix modal ---------- */
function openFixModal(pid, bid){
  const p=P(pid); if(!p) return;
  const b=p.bugs.find(x=>x.id===bid); if(!b) return;
  openModal(`<h3>Debugging</h3>
    <div class="tagrow"><span class="tag bad">bug</span><span class="meta faint">${esc(p.offer.title)}</span></div>
    <p class="mono" style="background:#070a11;border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0">${esc(b.q)}</p>
    <p class="meta">What's the right move?</p>
    ${b.opts.map((o,i)=>`<button class="chopt" data-opt="${i}">${esc(o.t)}</button>`).join("")}
    <div class="actions"><button class="btn ghost" data-close>Step away from the desk</button></div>`);
  $$("#modalBox [data-opt]").forEach(b2=>b2.onclick=()=>{
    const i=+b2.dataset.opt;
    if(b.opts[i].ok){ b2.classList.add("right"); setTimeout(()=>{closeModal();fixBug(pid,bid,i);},350); }
    else{ b2.classList.add("wrong"); b2.disabled=true; fixBug(pid,bid,i); }
  });
}
function openDeliverModal(pid){
  const p=P(pid); if(!p) return;
  const q=qualityNow(p);
  const due=p.offer.createdDay+p.offer.days;
  const onTime=S.day<=due+1;
  openModal(`<h3>Ship it?</h3>
    <p>Delivering <b>${esc(p.offer.title)}</b> to ${esc(p.client.company)}.</p>
    <div class="tagrow">
      <span class="tag ${q>=75?"good":q>=50?"warn":"bad"}">estimated quality ${q}/100</span>
      <span class="tag ${onTime?"good":"bad"}">${onTime?"on time":(S.day-due)+" day(s) late"}</span>
      ${p.bugs.length?`<span class="tag bad">${p.bugs.length} known bug(s)</span>`:`<span class="tag good">tests clean</span>`}
    </div>
    <p class="meta">You invoiced ${fmt$(p.quote-p.depositPaid)} (net ${p.client.netDays} days). The review lands a few days later. Quality drives it.</p>
    <div class="actions"><button class="btn ghost" data-close>Not yet</button><button class="btn primary" id="doDeliver">Ship it</button></div>`);
  $("#doDeliver").onclick=()=>{ closeModal(); deliverProject(pid); };
}
/* ---------- tabs / screens ---------- */
let curTab="inbox";
function switchTab(id){
  curTab=id;
  $$("#tabs .tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===id));
  ["inbox","work","clients","money","you"].forEach(x=>$("#tab-"+x).classList.toggle("hidden",x!==id));
  SFX.click();
}
function showScreen(which){
  $("#intro").classList.toggle("hidden",which!=="intro");
  $("#game").classList.toggle("hidden",which!=="main");
}
/* ---------- intro code rain ---------- */
function introRain(){
  const cv=$("#introCanvas"), ctx=cv.getContext("2d");
  let cols,drops;
  function size(){ cv.width=innerWidth; cv.height=innerHeight; cols=Math.floor(cv.width/16); drops=Array(cols).fill(0).map(()=>rnd(-30,0)); }
  size(); addEventListener("resize",size);
  const glyphs="01{}<>=;/$fnconstletreturnif".split("");
  let raf;
  function frame(){
    ctx.fillStyle="rgba(10,13,20,0.12)";
    ctx.fillRect(0,0,cv.width,cv.height);
    ctx.font="13px ui-monospace,Menlo,Consolas,monospace";
    for(let i=0;i<cols;i++){
      const x=i*16, y=drops[i]*16;
      ctx.fillStyle=chance(.06)?"rgba(143,123,255,.8)":"rgba(94,242,160,"+(chance(.5)?.55:.28)+")";
      ctx.fillText(pick(glyphs),x,y);
      drops[i]+=rnd(.2,.7);
      if(y>cv.height&&chance(.03)) drops[i]=rnd(-20,0);
    }
    raf=requestAnimationFrame(frame);
  }
  frame();
  return ()=>cancelAnimationFrame(raf);
}
/* ---------- boot ---------- */
let stopRain=null;
function init(){
  stopRain=introRain();
  if(hasSave()){
    $("#btnContinue").classList.remove("hidden");
    try{
      const old=JSON.parse(localStorage.getItem(SAVE_KEY));
      $("#introStats").textContent="save found: day "+old.day+" · "+fmt$(old.cash)+" · "+old.projectsDone+" project(s) shipped · rank "+RANKS[old.flags&&old.flags.rank||0].name;
    }catch(e){}
  }
  $("#btnNew").onclick=()=>{ ac(); SFX.click(); if(hasSave()&&!confirm("Start over? Your current save will be erased.")) return; wipeSave(); S=freshState(); genOffer(true); genOffer(true); save(); startMain(); };
  $("#btnContinue").onclick=()=>{ ac(); SFX.click(); if(load()) startMain(); else toast("Save was unreadable. Starting fresh.","bad"); };
  $$("#tabs .tab").forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));
  $("#btnSleep").onclick=()=>{ SFX.click(); advanceDay(); };
  $("#btnShop").onclick=()=>openShop();
  $("#btnCoffee").onclick=()=>buyCoffee();
  $("#btnDrink").onclick=()=>buyDrink();
  $("#btnBankTop").onclick=()=>openBank();
  $("#logo").onclick=()=>switchTab("inbox");
  document.addEventListener("keydown",e=>{
    if(!$("#game")||$("#game").classList.contains("hidden")) return;
    if(e.key==="Escape"&&$("#modalBox").dataset.lock!=="1") closeModal();
    if(modalIsOpen()) return;
    if(e.target&&["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)) return;
    const tabs=["inbox","work","clients","money","you"];
    if(e.key>="1"&&e.key<="5") switchTab(tabs[+e.key-1]);
    if(e.code==="Space"&&!e.repeat){ e.preventDefault(); advanceDay(); }
  });
}
function startMain(){
  showScreen("main");
  if(stopRain){ stopRain(); stopRain=null; }
  switchTab("inbox");
  renderAll();
  if(!S.welcomed){
    S.welcomed=true;
    openChoiceModal("Day one",
      "You rented a room with a desk, a laptop, and "+fmt$(S.cash)+" to your name. Rent is "+fmt$(RENT)+" on the first of every month. Your inbox already has offers. Pick one, quote it, build it, ship it, invoice it. The money arrives late. It always arrives late.",
      [{label:"Let's get to work",fn:()=>{}}]);
    save();
  }
}
document.addEventListener("DOMContentLoaded",init);

</script>
